<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đang bước vào khu rừng...</title>

    <link rel="stylesheet" href="walk.css">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="moon"></div>

        <div class="stars"></div>

        <div class="fog"></div>

        <div id="fireflies"></div>

        <div class="light"></div>

    </div>

    <!-- Hai bên rừng -->

    <div class="forest left-forest"></div>

    <div class="forest right-forest"></div>

    <!-- Hoa cẩm tú cầu -->

    <div class="flowers left-flowers"></div>

    <div class="flowers right-flowers"></div>

    <!-- Con đường -->

    <div class="road"></div>

    <!-- Nội dung -->

    <div class="content">

        <div class="loading-line"></div>

        <h1 id="typing">
            Đang bước vào khu rừng...
        </h1>

        <p>
            Một món quà nhỏ đang chờ ở cuối con đường ✨
        </p>

        <div class="progress">

            <div class="progress-bar"></div>

        </div>

    </div>

    <!-- Hiệu ứng ánh sáng -->

    <div class="overlay"></div>

    <script src="walk.js"></script>

</body>

</html>
