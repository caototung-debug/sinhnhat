<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bước vào khu rừng</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="walk.css">
</head>

<body>

    <!-- ================= BACKGROUND ================= -->
    <div class="background">
        <div class="moon"></div>
        <div class="stars"></div>
        <div class="light"></div>
        <div id="fireflies"></div>
        <div class="fog"></div>
    </div>

    <!-- ================= CON ĐƯỜNG ================= -->
    <div class="road"></div>

    <!-- ================= BỤI HOA CẨM TÚ CẦU THẬT (SVG) ================= -->
    <div class="hydrangea-field">
        
        <!-- Bụi hoa bên trái -->
        <svg class="flower-bush left-bush" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow-left" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Tán lá tối ở dưới -->
            <path d="M 20 350 Q 80 200 220 300 Q 300 380 400 380 L 0 400 Z" fill="#091428" />
            <path d="M 0 280 Q 150 180 250 350 Z" fill="#0f2347" />

            <!-- Cụm hoa 1 (To) -->
            <g filter="url(#glow-left)" transform="translate(100, 220)">
                <!-- Cánh hoa 4 cánh -->
                <g fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>

            <g filter="url(#glow-left)" transform="translate(140, 200) scale(0.9)">
                <g fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>

            <g filter="url(#glow-left)" transform="translate(70, 240) scale(1.1)">
                <g fill="#3b82f6" stroke="#172554" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>

            <g filter="url(#glow-left)" transform="translate(115, 260) scale(1.2)">
                <g fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>

            <!-- Cụm hoa 2 (Phía sau vươn cao) -->
            <g filter="url(#glow-left)" transform="translate(220, 150) scale(1.3)">
                <g fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>
            <g filter="url(#glow-left)" transform="translate(260, 180) scale(1.1)">
                <g fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>
        </svg>

        <!-- Bụi hoa bên phải -->
        <svg class="flower-bush right-bush" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow-right" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Tán lá tối -->
            <path d="M 380 350 Q 320 200 180 300 Q 100 380 0 380 L 400 400 Z" fill="#091428" />
            <path d="M 400 280 Q 250 180 150 350 Z" fill="#0f2347" />

            <!-- Cụm hoa bên phải -->
            <g filter="url(#glow-right)" transform="translate(280, 220) scale(1.2)">
                <g fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>

            <g filter="url(#glow-right)" transform="translate(240, 190) scale(1)">
                <g fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>

            <g filter="url(#glow-right)" transform="translate(320, 250) scale(1.1)">
                <g fill="#3b82f6" stroke="#172554" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>

            <g filter="url(#glow-right)" transform="translate(160, 160) scale(1.3)">
                <g fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5">
                    <path d="M-15,0 C-15,-10 0,-15 0,-15 C0,-15 15,-10 15,0 C15,10 0,15 0,15 C0,15 -15,10 -15,0 Z" />
                    <path d="M0,-15 C-10,-15 -15,0 -15,0 C-15,0 -10,15 0,15 C10,15 15,0 15,0 C15,0 10,-15 0,-15 Z" />
                </g>
                <circle cx="0" cy="0" r="3" fill="#ffffff" />
            </g>
        </svg>

    </div>

    <!-- ================= TEXT & LOADING ================= -->
    <div class="content">
        <h1 id="typing"></h1>
        <p>Một món quà nhỏ đang chờ ở cuối con đường ✨</p>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- ================= HỘP QUÀ ================= -->
    <div class="gift-container" id="gift">
        <div class="gift">
            <div class="gift-top"></div>
            <div class="gift-body"></div>
            <div class="gift-ribbon-v"></div>
            <div class="gift-ribbon-h"></div>
            <div class="gift-bow bow-left"></div>
            <div class="gift-bow bow-right"></div>
        </div>
    </div>

    <script src="walk.js"></script>
</body>

</html>
