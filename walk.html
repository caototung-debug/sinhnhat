<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Bước vào khu rừng</title>


<link rel="stylesheet" href="walk.css">


<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">


</head>


<body>


<!-- ================= BACKGROUND ================= -->


<div class="background">


    <div class="moon"></div>


    <div class="stars"></div>


    <div class="fog"></div>


    <div id="fireflies"></div>


    <div class="light"></div>


</div>

<!-- ================= HOA CẨM TÚ CẦU ================= -->


<div class="flowers left-flowers">
</div>


<div class="flowers right-flowers">
</div>



<!-- ================= CON ĐƯỜNG ================= -->


<div class="road"></div>





<!-- ================= TEXT ================= -->


<div class="content">


    <h1 id="typing"></h1>


    <p>

        Một món quà nhỏ đang chờ ở cuối con đường ✨

    </p>



    <div class="progress">


        <div class="progress-bar"></div>


    </div>



</div>






<!-- ================= HỘP QUÀ ================= -->


<div class="gift-container" id="gift">


    <div class="gift">


        <div class="gift-top"></div>


        <div class="gift-body"></div>


        <div class="gift-ribbon-v"></div>


        <div class="gift-ribbon-h"></div>


        <div class="gift-bow bow-left"></div>


        <div class="gift-bow bow-right"></div>


    </div>



</div>







<!-- ÁNH SÁNG NGOÀI -->

<div class="overlay"></div>





<script src="walk.js"></script>


</body>


</html>
