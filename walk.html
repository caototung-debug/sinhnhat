<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bước vào khu rừng</title>

    <!-- CSS chính -->
    <link rel="stylesheet" href="walk.css">

    <!-- Google Fonts hỗ trợ Tiếng Việt chuẩn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ================= BACKGROUND ================= -->
    <div class="background">
        <div class="moon"></div>
        <div class="stars"></div>
        <div class="light"></div>
        <div id="fireflies"></div>
        <div class="fog"></div>
    </div>

   <!-- ================= VƯỜN HOA CẨM TÚ CẦU NAVY ================= -->
<div class="hydrangea-field">
    <!-- Cụm hoa bên trái -->
    <svg class="flower-bush left-bush" viewBox="0 0 300 300">
        <defs>
            <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
                <stop offset="60%" stop-color="#1e40af" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <!-- Lớp lá và quầng sáng nền -->
        <circle cx="120" cy="180" r="90" fill="url(#flowerGlow)" />
        <circle cx="200" cy="220" r="70" fill="url(#flowerGlow)" />
        
        <!-- Các bông hoa cẩm tú cầu 4 cánh (Trái) -->
        <g class="petals" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1">
            <!-- Cụm 1 -->
            <g transform="translate(100, 150) scale(1.2)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
            <g transform="translate(125, 135) scale(1.1)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
            <g transform="translate(80, 165) scale(1)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
            </g>
            <g transform="translate(110, 175) scale(1.3)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
            <g transform="translate(140, 165) scale(1)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
            </g>
            <!-- Cụm 2 -->
            <g transform="translate(180, 200) scale(1.2)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
            <g transform="translate(205, 185) scale(1.1)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
            </g>
            <g transform="translate(190, 225) scale(1.3)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
            <g transform="translate(225, 215) scale(1)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
            </g>
        </g>
    </svg>

    <!-- Cụm hoa bên phải -->
    <svg class="flower-bush right-bush" viewBox="0 0 300 300">
        <!-- Quầng sáng nền -->
        <circle cx="180" cy="180" r="90" fill="url(#flowerGlow)" />
        <circle cx="100" cy="220" r="70" fill="url(#flowerGlow)" />
        
        <!-- Các bông hoa cẩm tú cầu 4 cánh (Phải) -->
        <g class="petals" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1">
            <g transform="translate(180, 150) scale(1.2)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
            <g transform="translate(155, 135) scale(1.1)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
            </g>
            <g transform="translate(200, 165) scale(1)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
            </g>
            <g transform="translate(170, 175) scale(1.3)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
            <g transform="translate(120, 200) scale(1.2)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
            <g transform="translate(95, 185) scale(1.1)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
            </g>
            <g transform="translate(110, 225) scale(1.3)">
                <path d="M0,-12 C3,-5 5,-3 12,0 C5,3 3,5 0,12 C-3,5 -5,3 -12,0 C-5,-3 -3,-5 0,-12 Z"/>
                <circle cx="0" cy="0" r="2" fill="#fff"/>
            </g>
        </g>
    </svg>
</div>

    <!-- ================= CON ĐƯỜNG ================= -->
    <div class="road"></div>

    <!-- ================= TEXT & LOADING ================= -->
    <div class="content">
        <h1 id="typing"></h1>
        <p>Một món quà nhỏ đang chờ ở cuối con đường ✨</p>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- ================= HỘP QUÀ ================= -->
    <div class="gift-container" id="gift">
        <div class="gift">
            <div class="gift-top"></div>
            <div class="gift-body"></div>
            <div class="gift-ribbon-v"></div>
            <div class="gift-ribbon-h"></div>
            <div class="gift-bow bow-left"></div>
            <div class="gift-bow bow-right"></div>
        </div>
    </div>

    <!-- LỚP PHỦ ÁNH SÁNG NGOÀI (NẾU CÓ) -->
    <div class="overlay"></div>

    <!-- JavaScript chính -->
    <script src="walk.js"></script>
</body>

</html>
