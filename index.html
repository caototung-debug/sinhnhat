<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Một Món Quà Dành Riêng Cho Bạn</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

    <!-- =================== PRELOADER =================== -->

    <div id="loading">

        <div class="loader-circle"></div>

        <p>Đang bước vào khu rừng...</p>

    </div>

    <!-- =================== BACKGROUND =================== -->

    <div class="background">

        <div class="sky"></div>

        <div class="moon"></div>

        <div class="stars"></div>

        <div class="fog fog1"></div>

        <div class="fog fog2"></div>

        <div class="mountain"></div>

        <div class="forest-back"></div>

        <div class="forest-front"></div>

        <div class="hydrangea-field"></div>

    </div>

    <!-- =================== PARTICLES =================== -->

    <div id="fireflies"></div>

    <div id="petals"></div>

    <div id="sparkles"></div>

    <!-- =================== MAIN =================== -->

    <main>

        <section class="intro">

            <h2 class="small-text">

                Có một điều...

            </h2>

            <h1 class="title">

                Mình Muốn Gửi Đến Bạn

            </h1>

            <p class="subtitle">

                Hãy bước vào khu rừng cẩm tú cầu và mở món quà đang chờ bạn...

            </p>

        </section>

        <!-- =================== GIFT =================== -->

        <section class="gift-section">

            <div class="light"></div>

            <div class="gift-container" id="gift">

                <div class="gift-shadow"></div>

                <div class="gift">

                    <div class="gift-top"></div>

                    <div class="gift-body"></div>

                    <div class="gift-ribbon-v"></div>

                    <div class="gift-ribbon-h"></div>

                    <div class="gift-bow bow-left"></div>

                    <div class="gift-bow bow-right"></div>

                </div>

            </div>

            <p class="click-text">

                ✨ Nhấn vào món quà để mở ✨

            </p>

        </section>

    </main>

    <!-- =================== OPEN EFFECT =================== -->

    <div id="flash"></div>

    <div id="white-screen"></div>

    <!-- =================== MUSIC =================== -->

    <audio id="bgMusic" loop>

        <source src="assets/piano.mp3" type="audio/mpeg">

    </audio>

    <audio id="openSound">

        <source src="assets/open.mp3" type="audio/mpeg">

    </audio>

    <!-- =================== SCRIPT =================== -->

    <script src="script.js"></script>

</body>

</html>
