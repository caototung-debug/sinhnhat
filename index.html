<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Khu rừng cẩm tú cầu</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

</head>


<body>


<div class="forest-background"></div>


<div class="overlay"></div>



<div class="content">


    <div class="decor">
        ✦
    </div>


    <h1>
        Đang bước vào khu rừng...
    </h1>


    <p>
        Một món quà nhỏ đang chờ ở cuối con đường ✨
    </p>



    <div class="gift"
    onclick="openGift()">


        <div class="box"></div>

        <div class="lid"></div>

        <div class="ribbon"></div>

        <div class="bow left"></div>

        <div class="bow right"></div>


    </div>


</div>



<script src="script.js"></script>


</body>


</html>
